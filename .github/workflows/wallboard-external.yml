# 工地看板外部區塊：雲端排程（每 30 分鐘）
#
# 取代「地端主機推快照」——把不需要公司內網、也不碰雲端資料庫的三塊
# （微型氣象站、本日出工、職安新知）改由 GitHub Actions 定時抓、推上
# 雲端 Blob。看板從此不依賴任何一台特定電腦，你的電腦關著也不會過期。
#
# 缺失統計、無災害、看板設定等「要資料庫」的區塊不在這裡——由雲端自己
# 在寫入時維護，看板讀取時再合併。因此本工作流程完全不吵醒雲端資料庫。
#
# 需要在 repo 設定的值（Settings → Secrets and variables → Actions）：
#   Secrets（機密）
#     WEATHER_API_PASS      氣象站密碼
#     WORKLOG_SHEET_URL     出工試算表網址（含人名/LINE ID）
#     CLOUD_INGEST_TOKEN    對應雲端環境變數 WALL_INGEST_TOKEN
#   Variables（非機密設定）
#     WEATHER_API_URL       氣象站平台網址
#     WEATHER_API_USER      氣象站帳號
#     WEATHER_SITE_MAP      測站 MAC 對工地代碼的 JSON
#     BUILDING_LABELS       例：BD04:辦公棟,BD05:住宅棟
#     PRIMARY_SITE_CODE     主場站代碼，例：BD04
#     CLOUD_INGEST_URL      例：https://safety-ops-dssis.netlify.app/api/v1/ingest/external
#
# 專案值放 Secrets/Variables、不寫進這支 YAML——公開 repo 不留任何工地資訊。
#
# 注意：公開 repo 連續 60 天沒有活動，GitHub 會自動停用排程。下方「保持排程
# 啟用」每天呼叫一次啟用 API 刷新狀態；若仍被停用（Actions 頁會顯示停用），
# 到 Actions → 工地看板外部區塊 → Enable workflow 即可恢復。

name: 工地看板外部區塊

on:
  # 主要時鐘是 Netlify 排程函式（backend/cloud/functions/wallboard-tick.mts）
  # 每 30 分鐘以 API 觸發 workflow_dispatch——實測 GitHub 自己的「每 30 分鐘」
  # 排程 20 小時只跑 6 次、間隔 2~5 小時，不能當主力。這裡的 schedule 只是
  # Netlify 那邊失效（例如 token 到期）時的後備。
  schedule:
    - cron: "22 * * * *"
  workflow_dispatch:
    inputs:
      worklog_backfill:
        description: "出工資料庫：推送試算表內全部歷史（首次建庫或解析規則改版後重算用）"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write          # 僅供「保持排程啟用」呼叫 workflow enable API

concurrency:
  group: wallboard-external
  cancel-in-progress: false   # 排隊而非取消：時鐘觸發與後備排程撞在一起時不丟任何一輪

jobs:
  push-external:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # 全系統時間戳慣例是「台北時間、無時區註記」。runner 程式本身也會釘住，
      # 這裡再設一次讓 shell 步驟（例如下方判斷時段）一致。
      TZ: "Asia/Taipei"
    steps:
      - name: 遮蔽機密的衍生值
        env:
          WORKLOG_SHEET_URL: ${{ secrets.WORKLOG_SHEET_URL }}
        run: |
          # GitHub 只遮蔽與 Secret 完全相同的字串，而程式實際請求的是轉換過的
          # /export?format=csv 網址。把試算表 ID 本身登記為遮蔽字串，任何形式
          # 的網址出現在日誌裡都會被遮掉（公開 repo 的日誌任何人可讀）。
          id=$(printf '%s' "$WORKLOG_SHEET_URL" | grep -oE '/d/[A-Za-z0-9_-]{10,}' | cut -c4- | head -n1)
          if [ -n "$id" ]; then echo "::add-mask::$id"; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝相依套件（SQLite 後端，免資料庫驅動）
        run: pip install -r backend/onprem/requirements.txt

      - name: 抓取外部區塊並推上雲端
        env:
          WEATHER_API_URL: ${{ vars.WEATHER_API_URL }}
          WEATHER_API_USER: ${{ vars.WEATHER_API_USER }}
          WEATHER_API_PASS: ${{ secrets.WEATHER_API_PASS }}
          WEATHER_SITE_MAP: ${{ vars.WEATHER_SITE_MAP }}
          WORKLOG_SHEET_URL: ${{ secrets.WORKLOG_SHEET_URL }}
          BUILDING_LABELS: ${{ vars.BUILDING_LABELS }}
          PRIMARY_SITE_CODE: ${{ vars.PRIMARY_SITE_CODE }}
          CLOUD_INGEST_URL: ${{ vars.CLOUD_INGEST_URL }}
          CLOUD_INGEST_TOKEN: ${{ secrets.CLOUD_INGEST_TOKEN }}
          PYTHONUTF8: "1"
        # 任一收集程式失敗時 runner 仍推送其餘區塊，然後以非 0 結束——這一步
        # 轉紅、GitHub 寄通知；雲端保留失敗區塊的上一份資料與時間戳。
        run: python backend/cloud-runner/run_external.py --push

      - name: 出工明細寫入資料庫（每天 00:07 那一輪；手動可推全部歷史）
        # 與上一步無關，上一步失敗也要做。資料庫按醒著的時數計費，只在凌晨
        # 寫一次（這時段看板每日首次讀取本來就會喚醒資料庫）；重送最近 14 天，
        # 某晚沒跑到由隔晚補上。00:22 的後備排程不寫，免得多喚醒一次。
        if: always()
        env:
          WORKLOG_SHEET_URL: ${{ secrets.WORKLOG_SHEET_URL }}
          BUILDING_LABELS: ${{ vars.BUILDING_LABELS }}
          CLOUD_INGEST_URL: ${{ vars.CLOUD_INGEST_URL }}
          CLOUD_INGEST_TOKEN: ${{ secrets.CLOUD_INGEST_TOKEN }}
          BACKFILL: ${{ github.event.inputs.worklog_backfill }}
          PYTHONUTF8: "1"
        run: |
          if [ "$BACKFILL" = "true" ]; then
            python backend/cloud-runner/push_worklog.py --all
          elif [ "$(date +%H)" = "00" ] && [ "$(date +%-M)" -lt 20 ]; then
            python backend/cloud-runner/push_worklog.py --days 14
          else
            echo "非凌晨那一輪，略過（出工資料庫每天寫一次）"
          fi

      - name: 保持排程啟用（公開 repo 60 天無活動會被停用）
        # 每天台北 06 點那幾輪做（不論哪種觸發）；上一步失敗也要做。
        # 停用後連 API 觸發都會被拒，所以時鐘改到 Netlify 後這步仍然需要。
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date +%H)" = "06" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/wallboard-external.yml/enable"
            echo "已刷新排程啟用狀態"
          fi
