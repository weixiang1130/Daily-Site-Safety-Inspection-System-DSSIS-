# Render 部署藍圖（後端）
#
# 用法：Render 後台 → New → Blueprint → 選這個 GitHub repo，
#      Render 會依本檔自動建立服務與資料庫。
#
# 為什麼用 Render 當試辦後端：不需信用卡即可起步、支援持久化磁碟
# （照片與 PDF 不會因重新部署而消失）、直接接 GitHub 自動部署。
#
# 注意：免費方案沒有持久化磁碟且閒置會休眠，工地實際使用請用 Starter 以上。

databases:
  - name: safety-ops-db
    databaseName: safetyops
    plan: starter          # free 方案 90 天後到期，試辦期滿請升級
    postgresMajorVersion: "16"

services:
  - type: web
    name: safety-ops-api
    runtime: python
    plan: starter          # 持久化磁碟需要付費方案
    region: singapore      # 離台灣最近
    buildCommand: pip install -r requirements-postgres.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 5           # 照片與 PDF 存放區
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safety-ops-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true          # Render 自動產生隨機金鑰
      - key: HTTPS_ONLY
        value: "true"
      - key: PUBLIC_DASHBOARD
        value: "false"               # 公開網際網路上務必維持 false
      - key: PYTHON_VERSION
        value: "3.11"
      # 品牌名稱：在 Render 後台手動填入，不進版控
      - key: BRAND_NAME
        sync: false
      - key: BRAND_SHORT_NAME
        sync: false
      # 設備廠商推送權杖：在 Render 後台手動填入
      - key: INGEST_TOKENS
        sync: false
