<!doctype html>
<html lang="zh-Hant" class="theme-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>戰情室</title>
<link rel="stylesheet" href="/static/brand.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="war-head">
  <div class="brand" id="brand"></div>
  <select id="site" aria-label="選擇工地"></select>
  <select id="days" aria-label="選擇統計區間">
    <option value="7">近 7 日</option>
    <option value="30" selected>近 30 日</option>
    <option value="90">近 90 日</option>
  </select>
  <div class="spacer"></div>
  <span class="stamp" id="stamp"></span>
  <span class="clock" id="clock"></span>
</div>

<div class="wrap wide">

  <!-- 主指標：只留四項需要當下判斷的數字 -->
  <div class="grid kpis-main" id="kpis"></div>

  <!-- 次要指標壓成一行，需要時才看 -->
  <div class="metric-strip" id="strip"></div>

  <!-- 工地環境：只列出需要注意的數值，正常的站收合成一個字 -->
  <div class="env-strip hidden" id="envPanel">
    <span class="env-strip-label">工地環境</span>
    <div class="env-strip-body" id="env"></div>
  </div>

  <!-- 逾期清單只在真的有逾期時出現；沒有逾期時上方 KPI 已足夠說明 -->
  <div class="panel hidden" id="overduePanel" style="margin-bottom:var(--sp-4)">
    <h3>逾期未改善　需立即處理</h3>
    <div class="table-scroll" id="overdue"></div>
  </div>

  <div class="grid cols-main">
    <div class="panel">
      <h3>最新缺失動態</h3>
      <div class="table-scroll panel-fill" id="recent"></div>
    </div>

    <div class="panel">
      <h3>最新填報表單</h3>
      <div class="table-scroll panel-fill" id="forms"></div>
    </div>

    <div class="panel-stack">
      <div class="panel">
        <h3>災害類別分布</h3>
        <div class="barlist" id="hazard"></div>
      </div>
      <div class="panel">
        <h3>廠商缺失排行</h3>
        <div class="barlist" id="vendor"></div>
      </div>
      <div class="panel">
        <h3>近 14 日趨勢</h3>
        <div class="spark" id="trend"></div>
        <div class="spark-labels" id="trendLabels"></div>
      </div>
    </div>
  </div>
</div>

<script src="/static/common.js"></script>
<script>
function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('zh-TW', { hour12: false });
}
setInterval(tick, 1000); tick();

async function load() {
  const site = document.getElementById('site').value;
  const days = document.getElementById('days').value;
  const d = await API.get(`/api/dashboard?days=${days}${site ? '&site_id=' + site : ''}`);
  const k = d.kpi;

  document.getElementById('stamp').textContent =
    '更新於 ' + d.generated_at.replace('T', ' ').slice(0, 16);

  // 逾期為 0 時不強調紅色，避免顏色失去警示意義
  document.getElementById('kpis').innerHTML = [
    [k.overdue ? 'critical' : 'ok', k.overdue, '逾期未改善'],
    ['accent', k.findings_today, '今日新增缺失'],
    [k.open ? 'warn' : 'ok', k.open, '未結案'],
    ['ok', k.closed_rate + '%', '結案率'],
  ].map(([c, n, l]) => `
    <div class="panel kpi ${c}"><div class="n">${n}</div><div class="l">${l}</div></div>`
  ).join('');

  // 在場人數放在最前面：緊急應變時要先知道現場還有多少人
  const hc = d.headcount;
  document.getElementById('strip').innerHTML = [
    ...(hc ? [
      ['現場在場人數', hc.headcount_present ?? '—'],
      ['今日進場', hc.headcount_in ?? '—'],
      ['今日出場', hc.headcount_out ?? '—'],
    ] : []),
    ['區間缺失', k.findings_range],
    ['當場改善', k.onsite_fixed],
    ['限期改善', k.scheduled],
    ['改善時效中位數', k.median_fix_hours == null ? '—' : k.median_fix_hours + ' 小時'],
    ['今日已交巡檢單', k.inspections_today],
  ].map(([l, v]) => `<span><i>${esc(l)}</i>${v}</span>`).join('');

  // 有逾期才顯示清單
  const panel = document.getElementById('overduePanel');
  panel.classList.toggle('hidden', d.overdue_list.length === 0);
  if (d.overdue_list.length) {
    document.getElementById('overdue').innerHTML = `
      <table class="fixed cols-overdue"><thead><tr><th>單號</th><th>工地</th><th>缺失內容</th>
      <th>責任廠商／人</th><th>期限</th><th>逾期</th></tr></thead><tbody>
      ${d.overdue_list.map(o => `<tr>
        <td class="num">${esc(o.no)}</td><td>${esc(o.site)}</td>
        <td>${esc(o.description)}</td>
        <td>${esc(o.vendor)}${o.person ? '／' + esc(o.person) : ''}</td>
        <td class="num">${esc(o.due_date || '')}</td>
        <td><span class="tag overdue">${o.days_over} 天</span></td>
      </tr>`).join('')}</tbody></table>`;
  }

  const barlist = (el, rows) => {
    const max = Math.max(1, ...rows.map(r => r.count));
    document.getElementById(el).innerHTML = rows.length
      ? rows.slice(0, 5).map(r => `
        <div class="r"><div class="lbl">${esc(r.label)}</div>
        <div class="track"><i style="width:${r.count / max * 100}%"></i></div>
        <div class="v">${r.count}</div></div>`).join('')
      : '<p class="muted">尚無資料</p>';
  };
  barlist('hazard', d.by_hazard);
  barlist('vendor', d.by_vendor);

  const max = Math.max(1, ...d.trend.map(t => t.count));
  document.getElementById('trend').innerHTML = d.trend.map(t =>
    `<div style="height:${t.count / max * 100}%" title="${t.date}：${t.count} 件"></div>`).join('');
  document.getElementById('trendLabels').innerHTML =
    `<span>${d.trend[0].date.slice(5)}</span>` +
    `<span>${d.trend[d.trend.length - 1].date.slice(5)}</span>`;

  renderEnvironment(d.environment || [], d.environment_spec || {});

  // 工地交出表單後要在牆上立刻看到，否則現場沒有回饋
  const forms = d.recent_forms || [];
  // PDF 連結掛在表單名稱上，省下一整欄；填報人放在 title 供滑鼠停留查看
  document.getElementById('forms').innerHTML = forms.length ? `
    <table class="fixed cols-forms"><thead><tr><th>日期</th><th>工地</th>
    <th>表單</th><th>結果</th></tr></thead><tbody>
    ${forms.map(f => {
      const tip = esc(f.title) + (f.person ? '／' + esc(f.person) : '');
      const name = f.pdf_url
        ? `<a href="${esc(f.pdf_url)}" target="_blank" title="${tip}">${esc(f.title)}</a>`
        : `<span title="${tip}">${esc(f.title)}</span>`;
      return `<tr>
      <td class="num">${esc(String(f.on_date).slice(5))}</td>
      <td title="${esc(f.site)}">${esc(f.site)}</td>
      <td>${name}</td>
      <td><span class="tag ${f.ok ? 'closed' : 'open'}">${esc(f.result)}</span></td>
    </tr>`; }).join('')}</tbody></table>`
    : '<p class="empty-state">尚無填報紀錄</p>';

  // 大螢幕上只呈現最近動態，不做完整日誌；詳細清單在缺失頁面查詢
  const recent = d.recent.slice(0, 16);
  // 欄位刻意精簡：災害類別與責任廠商在右欄已有統計，牆上重複顯示只會把
  // 每一列擠成三四行而難以掃讀。完整欄位在缺失頁面查詢。
  document.getElementById('recent').innerHTML = recent.length ? `
    <table class="fixed cols-recent"><thead><tr><th>時間</th><th>工地</th>
    <th>缺失內容</th><th>狀態</th></tr></thead><tbody>
    ${recent.map(r => `<tr>
      <td class="num">${esc(r.found_at.replace('T', ' ').slice(5))}</td>
      <td title="${esc(r.site)}">${esc(r.site)}</td>
      <td title="${esc(r.hazard_label)}／${esc(r.vendor)}：${esc(r.description)}">${esc(r.description)}</td>
      <td><span class="tag ${r.status === 'closed' ? 'closed' : r.status === 'fixed' ? 'fixed' : 'open'}">
        ${STATUS_LABEL[r.status] || r.status}</span></td>
    </tr>`).join('')}</tbody></table>`
    : '<p class="empty-state">區間內無缺失紀錄</p>';
}

// 顯示順序：能直接觸發管理動作的排前面。
// 門檻與分級一律由後端 lib/hazard.ts 判定並隨 API 回傳，此處只負責呈現，
// 避免前後端各有一套標準而顯示與告警依據不一致。
const ENV_ORDER = ['heat_index','noise','pm25','pm10','temperature','humidity'];

// 0 正常｜1 注意｜2 警戒｜3 危險｜4 極度危險
const LEVEL_CLASS = ['ok','notice','warn','critical','critical'];

function renderEnvironment(list, spec) {
  const panel = document.getElementById('envPanel');
  panel.classList.toggle('hidden', list.length === 0);
  if (!list.length) return;

  document.getElementById('env').innerHTML = list.map(st => {
    const levels = st.levels || {};

    // 牆面要回答的是「哪裡有危險」，不是完整報表：
    // 只列出達到注意以上的項目；熱指數因為是唯一能直接觸發停工／加強休息
    // 的指標，一律顯示。
    const shown = ENV_ORDER.filter(k => {
      if (st.metrics[k] == null) return false;
      return k === 'heat_index' || (levels[k] || 0) > 0;
    });

    const cells = shown.length
      ? shown.map(k => {
          const v = st.metrics[k];
          const unit = (spec[k] && spec[k].unit) || '';
          const label = (spec[k] && spec[k].label) || k;
          return `<span class="env-metric ${LEVEL_CLASS[levels[k] || 0]}">
            <i>${esc(label)}</i>${v}<u>${esc(unit)}</u></span>`;
        }).join('')
      : '<span class="env-metric ok">正常</span>';

    // 整站等級只在超過正常時才標示，否則牆上到處都是徽章反而失去警示作用
    const badge = st.level > 0
      ? `<span class="env-level l${st.level}">${esc(st.level_label)}</span>` : '';

    return `<span class="env-item">
      <b>${esc(st.site || st.station)}</b>${badge}${cells}</span>`;
  }).join('');
}

(async () => {
  renderBrand('war_room_name');

  // 戰情室大螢幕可不登入直接開啟，因此這裡不使用會導向登入頁的 API.get
  let sites = [];
  const r = await fetch('/api/sites', { credentials: 'same-origin' });
  if (r.ok) sites = await r.json();
  document.getElementById('site').innerHTML = siteOptions(sites, null, '全部工地');

  document.getElementById('site').onchange = load;
  document.getElementById('days').onchange = load;
  await load();
  setInterval(load, 60000);   // 每分鐘自動刷新
})().catch(err => {
  // 未登入的情況 API.get 已自行導向登入頁；其他錯誤要顯示出來，
  // 不能一律跳轉，否則畫面只會莫名其妙彈回登入頁而查不出原因。
  if (String(err && err.message) === '未登入') return;
  document.querySelector('.wrap').innerHTML =
    `<div class="panel"><h3>載入失敗</h3>
     <p class="muted">${esc(err && err.message || '未知錯誤')}</p>
     <p class="muted">請重新整理；若持續發生，請聯絡系統管理員。</p></div>`;
});
</script>
</body>
</html>
