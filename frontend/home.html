<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>首頁</title>
<link rel="stylesheet" href="/static/brand.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand" id="brand"></div>
  <div class="spacer"></div>
  <span class="who" id="who"></span>
  <button class="ghost" id="out">登出</button>
</div>

<div class="wrap">
  <div class="page-head">
    <div class="eyebrow">Daily Operations</div>
    <h1>今日作業</h1>
    <p class="lede">選擇今日的作業類別填報自主檢查表；巡視發現的缺失會即時進入戰情儀表板。</p>
  </div>

  <div class="card">
    <span class="chapter">01</span>
    <h2>填報</h2>
    <div class="row">
      <a href="/static/fill.html"><button style="width:100%">自主檢查表</button></a>
      <a href="/static/coord.html"><button style="width:100%">每日協議巡視表</button></a>
    </div>
    <p class="muted" style="margin-bottom:0">
      自主檢查表共 28 種。選定作業類別後，系統只帶出該表單的檢查項目。
    </p>
  </div>

  <div class="card">
    <span class="chapter">02</span>
    <h2>缺失概況</h2>
    <div class="grid kpis" id="mini" style="margin-bottom:var(--sp-5)"></div>
    <div class="row">
      <a href="/static/findings.html"><button class="ghost" style="width:100%">缺失清單／複驗</button></a>
      <a href="/static/dashboard.html" class="hidden" id="warRoomLink"><button class="ghost" style="width:100%">工地看板</button></a>
    </div>
    <div class="row hidden" id="adminRow" style="margin-top:var(--sp-3)">
      <a href="/static/admin.html"><button class="ghost" style="width:100%">系統管理（工地／廠商／密碼）</button></a>
    </div>
  </div>

  <div class="card">
    <span class="chapter">03</span>
    <h2>近期單據</h2>
    <div id="recent" class="muted">載入中…</div>
  </div>
</div>

<script src="/static/common.js"></script>
<script>
let me = null;

(async () => {
  renderBrand('system_name');
  injectArchFrame();

  const r = await API.get('/api/me');
  if (!r.user) { location.href = '/static/index.html'; return; }
  me = r.user;
  document.getElementById('who').textContent = `${me.name}（${me.username}）`;
  if (me.role === 'admin') document.getElementById('adminRow').classList.remove('hidden');

  // 戰情室入口只在跑得起戰情室的那一側顯示。雲端已把它移到公司內網，
  // 留著按鈕只會連到 404。
  const brand = (await loadBranding()) || {};
  if (brand.war_room) document.getElementById('warRoomLink').classList.remove('hidden');

  // 只取三個數字。戰情室搬到地端後 /api/dashboard 已不在雲端，
  // 而首頁本來也用不到那份完整彙總。
  const d = await API.get('/api/findings/summary');
  document.getElementById('mini').innerHTML = [
    ['accent', d.findings_today, '今日缺失'],
    ['warn', d.open, '未結案'],
    ['critical', d.overdue, '逾期未改善']
  ].map(([c, n, l]) => `
    <div class="panel kpi ${c}"><div class="n">${n}</div><div class="l">${l}</div></div>`
  ).join('');

  const [insp, coord] = await Promise.all([
    API.get('/api/inspections?days=14'), API.get('/api/coordinations?days=14')
  ]);
  // 單一工地之後，棟別才是有資訊量的欄位；舊資料沒有棟別時退回工地名
  const rows = [
    ...insp.map(i => ({ d: i.inspect_date, t: i.form_title, s: i.building || i.site,
                        extra: `不合格 ${i.fail_count} 項`, url: i.pdf_url })),
    ...coord.map(c => ({ d: c.work_date, t: '每日協議巡視處理紀錄表',
                         s: c.building || c.site,
                         extra: `參加 ${c.attendee_count} 人`, url: c.pdf_url }))
  ].sort((a, b) => b.d.localeCompare(a.d)).slice(0, 15);

  document.getElementById('recent').innerHTML = rows.length ? `
    <div class="table-scroll"><table>
    <thead><tr><th>日期</th><th>單別</th><th>棟別</th><th></th><th></th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td class="num">${esc(r.d)}</td><td>${esc(r.t)}</td><td>${esc(r.s)}</td>
      <td class="muted">${esc(r.extra)}</td>
      <td>${r.url ? `<a href="${r.url}" target="_blank">PDF</a>` : ''}</td>
    </tr>`).join('')}</tbody></table></div>` : '<p class="muted">近 14 日尚無單據。</p>';
})();

document.getElementById('out').onclick = async () => {
  await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
  location.href = '/static/index.html';
};
</script>
</body>
</html>
