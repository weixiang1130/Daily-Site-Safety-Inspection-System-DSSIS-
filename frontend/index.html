<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登入</title>
<link rel="stylesheet" href="/static/brand.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand" id="brand"></div>
  <div class="spacer"></div>
</div>

<div class="auth-wrap">
  <div class="page-head">
    <div class="eyebrow">Occupational Safety</div>
    <div class="display-cjk" id="hero">職安填報系統</div>
  </div>

  <div class="card">
    <h2>登入</h2>
    <form id="f">
      <label for="u">帳號</label>
      <input id="u" name="username" type="text" autocomplete="username" required>
      <label for="p">密碼</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <div style="margin-top:var(--sp-5)">
        <button type="submit" style="width:100%">登入</button>
      </div>
    </form>
    <h3>原型測試帳號</h3>
    <table>
      <tbody>
        <tr><td class="num">insp03 / insp1234</td><td class="muted">檢查人員</td></tr>
        <tr><td class="num">safe01 / safe1234</td><td class="muted">職安人員</td></tr>
        <tr><td class="num">pm01 / pm1234</td><td class="muted">工程專案主管</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h2>戰情室</h2>
    <p class="muted" style="margin-top:0">大螢幕看板免登入即可開啟。</p>
    <a href="/static/dashboard.html">
      <button class="ghost" style="width:100%">開啟戰情儀表板</button></a>
  </div>
</div>

<script src="/static/common.js"></script>
<script>
(async () => {
  renderBrand('system_name');
  injectArchFrame();
  const b = await loadBranding();
  if (b.system_name) document.getElementById('hero').textContent = b.system_name;
  const r = await fetch('/api/me', { credentials: 'same-origin' }).then(r => r.json());
  if (r.user) location.href = '/static/home.html';
})();

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    await API.form('/api/login', new FormData(e.target));
    location.href = '/static/home.html';
  } catch (err) { toast('登入失敗：' + err.message); }
});
</script>
</body>
</html>
