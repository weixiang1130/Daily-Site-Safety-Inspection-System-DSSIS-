<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>職安填報系統｜登入</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="topbar">
  <h1>職安填報系統</h1>
  <div class="spacer"></div>
</div>

<div class="wrap" style="max-width:420px;padding-top:36px">
  <div class="card">
    <h2>登入</h2>
    <form id="f">
      <label for="u">帳號</label>
      <input id="u" name="username" type="text" autocomplete="username" required>
      <label for="p">密碼</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <div style="margin-top:18px">
        <button type="submit" style="width:100%">登入</button>
      </div>
    </form>
    <p class="muted" style="margin-top:18px">
      原型測試帳號：<br>
      insp03 / insp1234（檢查人員）<br>
      safe01 / safe1234（職安人員）<br>
      pm01 / pm1234（工程專案主管）
    </p>
  </div>
  <div class="card">
    <h2>戰情室</h2>
    <p class="muted">大螢幕看板免登入即可開啟。</p>
    <a href="/static/dashboard.html"><button class="ghost" style="width:100%">開啟戰情儀表板</button></a>
  </div>
</div>

<script src="/static/common.js"></script>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    await API.form('/api/login', fd);
    location.href = '/static/home.html';
  } catch (err) { toast('登入失敗：' + err.message); }
});
(async () => {
  const r = await fetch('/api/me', { credentials: 'same-origin' }).then(r => r.json());
  if (r.user) location.href = '/static/home.html';
})();
</script>
</body>
</html>
