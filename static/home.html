<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>職安填報系統</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="topbar">
  <h1>職安填報系統</h1>
  <div class="spacer"></div>
  <span class="who" id="who"></span>
  <button class="ghost" id="out">登出</button>
</div>

<div class="wrap">
  <div class="card">
    <h2>今日填報</h2>
    <div class="row">
      <a href="/static/fill.html" style="text-decoration:none">
        <button style="width:100%">填自主檢查表</button></a>
      <a href="/static/coord.html" style="text-decoration:none">
        <button style="width:100%">填每日協議巡視表</button></a>
    </div>
    <p class="muted" style="margin-top:12px">
      自主檢查表共 28 種。選擇今日作業類別後，系統只會帶出該表單的檢查項目。
    </p>
  </div>

  <div class="card">
    <h2>缺失追蹤</h2>
    <div class="row">
      <a href="/static/findings.html" style="text-decoration:none">
        <button class="ghost" style="width:100%">缺失清單／複驗</button></a>
      <a href="/static/dashboard.html" style="text-decoration:none">
        <button class="ghost" style="width:100%">戰情儀表板</button></a>
    </div>
    <div id="mini" class="row" style="margin-top:14px"></div>
  </div>

  <div class="card">
    <h2>近期單據</h2>
    <div id="recent" class="muted">載入中…</div>
  </div>
</div>

<script src="/static/common.js"></script>
<script>
let me = null;

(async () => {
  const r = await API.get('/api/me');
  if (!r.user) { location.href = '/static/index.html'; return; }
  me = r.user;
  document.getElementById('who').textContent = `${me.name}（${me.username}）`;

  const d = await API.get('/api/dashboard?days=30');
  document.getElementById('mini').innerHTML = `
    <div class="card" style="margin:0;text-align:center">
      <div style="font-size:30px;font-weight:800">${d.kpi.findings_today}</div>
      <div class="muted">今日缺失</div></div>
    <div class="card" style="margin:0;text-align:center">
      <div style="font-size:30px;font-weight:800;color:var(--warn)">${d.kpi.open}</div>
      <div class="muted">未結案</div></div>
    <div class="card" style="margin:0;text-align:center">
      <div style="font-size:30px;font-weight:800;color:var(--bad)">${d.kpi.overdue}</div>
      <div class="muted">逾期未改善</div></div>`;

  const [insp, coord] = await Promise.all([
    API.get('/api/inspections?days=14'), API.get('/api/coordinations?days=14')
  ]);
  const rows = [
    ...insp.map(i => ({ d: i.inspect_date, t: i.form_title, s: i.site,
                        extra: `不合格 ${i.fail_count} 項`, url: i.pdf_url })),
    ...coord.map(c => ({ d: c.work_date, t: '每日協議巡視處理紀錄表', s: c.site,
                         extra: `參加 ${c.attendee_count} 人`, url: c.pdf_url }))
  ].sort((a, b) => b.d.localeCompare(a.d)).slice(0, 15);

  document.getElementById('recent').innerHTML = rows.length ? `
    <table><thead><tr><th>日期</th><th>單別</th><th>工地</th><th></th><th></th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${esc(r.d)}</td><td>${esc(r.t)}</td><td>${esc(r.s)}</td>
      <td class="muted">${esc(r.extra)}</td>
      <td>${r.url ? `<a href="${r.url}" target="_blank">PDF</a>` : ''}</td>
    </tr>`).join('')}</tbody></table>` : '<p class="muted">近 14 日尚無單據。</p>';
})();

document.getElementById('out').onclick = async () => {
  await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
  location.href = '/static/index.html';
};
</script>
</body>
</html>
