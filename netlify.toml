# Netlify 設定
#
# 整套系統跑在 Netlify 上：
#   前端    frontend/ → 建置為 dist/static/
#   API     backend/cloud/functions/api.mts（處理所有 /api/*）
#   資料庫  Netlify Database（Postgres，部署時自動佈建與套用 migration）
#   檔案    Netlify Blobs（照片、手寫簽名、產出的 PDF）
#
# 注意：migration 必須放在 netlify/database/migrations/，這是 Netlify 平台
# 規定的固定路徑，因此未隨其他後端程式碼一起移到 backend/ 底下。
#
# 部署前請在 Site configuration → Environment variables 設定：
#   SECRET_KEY        session 簽章金鑰（務必自行產生長隨機字串）
#   BRAND_NAME        公司全名（不寫進版控）
#   BRAND_SHORT_NAME  公司簡稱
#   INGEST_TOKENS     設備廠商推送權杖，格式 vendor-a:xxx,vendor-b:yyy
#   PUBLIC_DASHBOARD  預設 false。設為 true 會讓任何拿到網址的人都看得到
#                     全公司缺失資料，僅限公司內網的戰情室大螢幕使用。

[build]
  publish = "dist"
  command = "python3 backend/tools/build_frontend.py"
  # 只在真正影響雲端的檔案有變時才建置。
  #
  # 這個 repo 大部分的改動（backend/onprem、backend/tools、docs）只跟公司
  # 內網的地端主機與工地檢視器有關，雲端一行都不會用到；但每一次 push
  # 預設都會觸發一次完整部署，而部署是這個站台最大的 credits 消耗來源
  # ——2026 年 8 月的用量高峰全部對應到當天的密集 commit。
  #
  # git diff --quiet 在「沒有差異」時回傳 0，而 Netlify 規定 ignore 指令
  # 回傳 0 就跳過建置——語意剛好吻合，不需要額外的判斷邏輯。
  # 首次建置或取不到 CACHED_COMMIT_REF 時 git 會回非 0，於是照常建置，
  # 失敗方向是安全的（寧可多建一次，不要漏掉該上線的變更）。
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- frontend backend/cloud netlify netlify.toml package.json"

[build.environment]
  PYTHON_VERSION = "3.11"
  NODE_VERSION = "20"

[functions]
  directory = "backend/cloud/functions"
  node_bundler = "esbuild"
  # PDF 產出所需的中文字型必須一併打包，否則函式在雲端找不到字型檔。
  # 只打包 .ttf：同目錄的 .otf 僅作為轉換來源，不需進函式（見 backend/tools/build_pdf_font.py）。
  included_files = ["backend/cloud/assets/fonts/*.ttf"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"

[[headers]]
  for = "/static/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
