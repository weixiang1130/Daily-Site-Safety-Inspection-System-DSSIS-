# Netlify 設定
#
# 整套系統跑在 Netlify 上：
#   前端    static/ → 建置為 dist/
#   API     netlify/functions/api.mts（處理所有 /api/*）
#   資料庫  Netlify Database（Postgres，部署時自動佈建與套用 migration）
#   檔案    Netlify Blobs（照片、手寫簽名、產出的 PDF）
#
# 部署前請在 Site configuration → Environment variables 設定：
#   SECRET_KEY        session 簽章金鑰（務必自行產生長隨機字串）
#   BRAND_NAME        公司全名（不寫進版控）
#   BRAND_SHORT_NAME  公司簡稱
#   INGEST_TOKENS     設備廠商推送權杖，格式 vendor-a:xxx,vendor-b:yyy
#   PUBLIC_DASHBOARD  預設 false。設為 true 會讓任何拿到網址的人都看得到
#                     全公司缺失資料，僅限公司內網的戰情室大螢幕使用。

[build]
  publish = "dist"
  command = "python3 tools/build_frontend.py"

[build.environment]
  PYTHON_VERSION = "3.11"
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # PDF 產出所需的中文字型必須一併打包，否則函式在雲端找不到字型檔。
  included_files = ["assets/fonts/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"

[[headers]]
  for = "/static/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
